<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <title>Mianji | میانجی - شبکه امن واسطه‌گری</title>
    <meta name="description" content="Secure digital escrow network for high-end freelance deals and exchanges." />
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <meta property="og:title" content="Mianji | میانجی" />
    <meta property="og:description" content="Secure digital escrow network for high-end freelance deals and exchanges." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('mianji_theme');
          var isDark = saved !== 'light';
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.style.colorScheme = isDark ? 'dark' : 'only light';
          var csMeta = document.querySelector('meta[name="color-scheme"]');
          if (csMeta) csMeta.setAttribute('content', isDark ? 'dark' : 'only light');
          var tcMeta = document.querySelector('meta[name="theme-color"]');
          if (tcMeta) tcMeta.setAttribute('content', isDark ? '#05070b' : '#ffffff');
        } catch (e) {}
      })();
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
